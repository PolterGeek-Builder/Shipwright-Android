# Builds an installable APK of the Ocarina of Time launcher (Ship of Harkinian for Android + mod manager + Play together).
# Everything the launcher adds is stored inside this one file (the block of letters further down). Nothing else needs
# to be uploaded. Run it from the Actions tab: choose "Build launcher APK", then "Run workflow".
# The finished APK appears under the repository's "Releases". No game files or ROMs are involved.
name: Build launcher APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_COMMIT: c9d8f4a1219d4db0b577a050634679f72f7b3595
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Add the launcher to the project
        run: |
          echo "Project is at $(git rev-parse HEAD); launcher was written against $BASE_COMMIT"
          base64 -d > /tmp/launcher-overlay.zip <<'OVERLAY_END'
