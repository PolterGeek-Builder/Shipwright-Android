          PAYLOAD_END
          test -f Android/app/src/main/java/com/dishii/soh/launcher/LauncherActivity.java
          echo "Launcher files added."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          wget -q https://github.com/Kitware/CMake/releases/download/v3.31.5/cmake-3.31.5-linux-x86_64.sh -O /tmp/cmake.sh
          sudo sh /tmp/cmake.sh --skip-license --prefix=/usr/local
          cmake --version

      - name: Set up Android SDK and NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK at $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-31" "build-tools;30.0.2" "ndk;26.0.10792818"
          echo "sdk.dir=$SDK" > Android/local.properties

      - name: Build the APK
        run: |
          cd Android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: Android/app/build/outputs/apk/release/*.apk

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" Android/app/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Launcher APK (build ${{ github.run_number }})" \
            --notes "Installable APK of the Ocarina of Time launcher. You supply your own ROM inside the app; none is included."

      # Runs even when the build fails: saves a short report to the "build-log" branch so a failure can be diagnosed.
      - name: Save the build report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/report && cd /tmp/report
          LOG="$GITHUB_WORKSPACE/build.log"
          {
            echo "job status: ${{ job.status }}"
            echo "run: ${{ github.run_number }}  commit: ${{ github.sha }}"
            date -u
            echo
            echo "=== error lines ==="
            if [ -f "$LOG" ]; then grep -n -E "error:|FAILED|What went wrong|Execution failed|fatal error|undefined reference|CMake Error|not found" "$LOG" | head -150; else echo "(no build log: the build did not start)"; fi
            echo
            echo "=== last 200 lines ==="
            if [ -f "$LOG" ]; then tail -n 200 "$LOG"; fi
          } > report.txt
          [ -f "$LOG" ] && gzip -9 -c "$LOG" > build.log.gz || true
          git init -q
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -q -b build-log
          git add -A
          git commit -q -m "Build report for run ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-log

